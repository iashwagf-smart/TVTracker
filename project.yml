name: TVTracker
options:
  bundleIdPrefix: com.personal
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # غيّر هذا لمعرّف خاص فيك (أو مرره من GitHub Actions)
    APP_BUNDLE_ID: com.personal.tvtracker
    APP_GROUP: group.$(APP_BUNDLE_ID)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TVTracker:
    type: application
    platform: iOS
    sources:
      - path: TVTracker
    dependencies:
      - target: TVTrackerWidget
    scheme: {}
    entitlements:
      path: TVTracker/TVTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: TVTracker/Info.plist
      properties:
        CFBundleDisplayName: TVTracker
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  TVTrackerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TVTrackerWidget
      - path: TVTracker/Models/Models.swift
      - path: TVTracker/Shared
    entitlements:
      path: TVTrackerWidget/TVTrackerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: TVTrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: TVTracker Widget
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
